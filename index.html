/* =======================================================================
   แอปหลัก
   ======================================================================= */
function App() {
  const [phase, setPhase] = useState('loading');     // loading | login | app
  const [data, setData] = useState({ debtors: [], users: [] });
  const [currentUser, setCurrentUser] = useState(null);
  const [view, setView] = useState('dashboard');
  const [selectedId, setSelectedId] = useState(null);
  const [warn, setWarn] = useState(false);
  const [calcInitName, setCalcInitName] = useState('');
  const [secLeft, setSecLeft] = useState(60);
  const [encOK, setEncOK] = useState(true);

  // modal states
  const [debtorForm, setDebtorForm] = useState(null);   // {mode, debtor?}
  const [loanForm, setLoanForm] = useState(null);       // {debtorId, loan?}
  const [paymentForm, setPaymentForm] = useState(null); // {debtorId, loanId, month}
  const [shareDebtor, setShareDebtor] = useState(null);
  const [confirmBox, setConfirmBox] = useState(null);   // {text, onYes}
  const [userForm, setUserForm] = useState(null);       // {mode:'add'|'edit'|'password', user?}
  const [recoveryInfo, setRecoveryInfo] = useState(null); // {token, username} หลังสร้างกุญแจ
  const [notifyPerm, setNotifyPerm] = useState('default'); // สถานะสิทธิ์แจ้งเตือน
  const [swReady, setSwReady] = useState(false);          // Service Worker พร้อมหรือไม่

  const hydrated = useRef(false);
  const lastActivity = useRef(Date.now());
  const viewRef = useRef(view); viewRef.current = view;
  const selRef = useRef(selectedId); selRef.current = selectedId;
  const userRef = useRef(currentUser); userRef.current = currentUser;

  /* ---- โหลดข้อมูล + กู้คืนเซสชันตอนเปิดแอป ---- */
  useEffect(() => {
    (async () => {
      setEncOK(!!(window.crypto && window.crypto.subtle));
      let d = await loadData();
      if (!d || !Array.isArray(d.debtors)) {
        d = await makeSeed();
        await saveData(d);
      } else if (!Array.isArray(d.users) || d.users.length === 0) {
        // ข้อมูลเดิมยังไม่มีระบบผู้ใช้ — สร้างผู้ดูแลระบบเริ่มต้น
        const cred = await makeCredential('admin1234');
        d = { ...d, users: [{
          id: uid(), username: 'admin', name: 'ผู้ดูแลระบบ', role: 'admin',
          cred, createdAt: Date.now(),
        }] };
        await saveData(d);
      }
      setData(d);
      const sess = await loadSession();
      const sessUser = sess && sess.userId
        ? (d.users || []).find((u) => u.id === sess.userId) : null;
      if (sess && sess.loggedIn && sessUser
        && (Date.now() - (sess.lastActivity || 0) < AUTO_LOGOUT_MS)) {
        setCurrentUser(sessUser);
        setView(sess.view === 'users' ? 'users' : (sess.view || 'dashboard'));
        setSelectedId(sess.selectedId || null);
        lastActivity.current = Date.now();   // การรีเฟรช = การใช้งาน
        setPhase('app');
      } else {
        // ตรวจว่าปิด login ไว้ไหม
        const authEnabled = localStorage.getItem(AUTH_ENABLED_KEY);
        if (authEnabled === 'false') {
          setView(sess && sess.view ? sess.view : 'dashboard');
          setSelectedId(sess && sess.selectedId ? sess.selectedId : null);
          setPhase('app');
        } else {
          setPhase('login');
        }
      }
      hydrated.current = true;
    })();
  }, []);

  /* ---- บันทึกข้อมูลอัตโนมัติทุกการเปลี่ยนแปลง ---- */
  useEffect(() => {
    if (!hydrated.current) return;
    saveData(data);
  }, [data]);

  /* ---- บันทึกเซสชัน (หน้าปัจจุบัน) เพื่อให้รีเฟรชแล้วอยู่หน้าเดิม ---- */
  useEffect(() => {
    if (!hydrated.current || phase !== 'app') return;
    saveSession({
      loggedIn: true, lastActivity: lastActivity.current, view, selectedId,
      userId: currentUser?.id || null,
    });
  }, [phase, view, selectedId, currentUser]);

  /* ---- ลงทะเบียน Service Worker + เช็คสิทธิ์แจ้งเตือน (ครั้งเดียวตอนเปิดแอป) ---- */
  useEffect(() => {
    if (notifySupported()) setNotifyPerm(Notification.permission);
    (async () => {
      const r = await registerServiceWorker();
      setSwReady(r.ok);
    })();
  }, []);

  /* ---- แจ้งเตือนถึงรอบเรียกเก็บ — ยิง 1 ครั้ง/เดือน เมื่อถึงวันแจ้งเตือน ---- */
  useEffect(() => {
    if (phase !== 'app') return;
    (async () => {
      const cur = curYM();
      // รวมยอดที่ต้องเรียกเก็บเดือนนี้
      let totalDue = 0, count = 0;
      (data.debtors || []).forEach((d) => {
        const ds = debtorStats(d, cur);
        if (ds.dueNow > 0.005) { totalDue += ds.dueNow; count++; }
      });

      // ส่งข้อมูลให้ Service Worker เผื่อแจ้งเตือนเบื้องหลัง
      try {
        if ('serviceWorker' in navigator) {
          const reg = await navigator.serviceWorker.getRegistration();
          const flag = await storageGet(NOTIFY_FLAG_KEY);
          reg?.active?.postMessage({
            type: 'update-notify-state',
            state: {
              notifyDateISO: nextNotifyDate().toISOString(),
              dueCount: count, dueTotal: fmtMoney(totalDue),
              currentMonth: cur, lastNotifiedMonth: flag || null,
            },
          });
        }
      } catch (e) { /* ข้าม */ }

      // แจ้งเตือนทันที (foreground) ถ้าได้รับอนุญาตและถึงกำหนด
      if (!notifySupported() || Notification.permission !== 'granted') return;
      const flag = await storageGet(NOTIFY_FLAG_KEY);
      if (flag === cur) return;                          // แจ้งไปแล้วเดือนนี้
      if (!isCollectionPeriod()) return;                 // ยังไม่ถึงวันแจ้งเตือน
      if (count === 0) return;
      const ok = await showNotification(
        'ถึงรอบเรียกเก็บเงินกู้แล้ว',
        `มีลูกหนี้ ${count} ราย ยอดรวม ${fmtMoney(totalDue)} บาท — เปิดแอปเพื่อตรวจสอบ`
      );
      if (ok) await storageSet(NOTIFY_FLAG_KEY, cur);    // กันแจ้งซ้ำเดือนนี้
    })();
  }, [phase, data]);

  // เปิด/ขอสิทธิ์แจ้งเตือนจากปุ่มในหน้าตั้งค่า
  const enableNotifications = async () => {
    const perm = await requestNotifyPermission();
    setNotifyPerm(perm);
    if (perm === 'granted') {
      await showNotification('เปิดการแจ้งเตือนแล้ว',
        'ระบบจะเตือนคุณเมื่อถึงรอบเรียกเก็บเงินกู้ในแต่ละเดือน');
    }
  };

  const doLogout = useCallback(async () => {
    await saveSession({ loggedIn: false, lastActivity: 0, view: 'dashboard', selectedId: null, userId: null });
    setWarn(false);
    setCurrentUser(null);
    const authEnabled = localStorage.getItem(AUTH_ENABLED_KEY);
    if (authEnabled === 'false') { setView('dashboard'); setPhase('app'); }
    else { setPhase('login'); }
  }, []);

  /* ---- ติดตามการใช้งาน + ออกจากระบบอัตโนมัติ ---- */
  useEffect(() => {
    if (phase !== 'app') return;
    const bump = () => { lastActivity.current = Date.now(); };
    const events = ['mousedown', 'keydown', 'touchstart', 'scroll', 'click', 'mousemove'];
    events.forEach((e) => window.addEventListener(e, bump, { passive: true }));

    const persist = setInterval(() => {
      saveSession({
        loggedIn: true, lastActivity: lastActivity.current,
        view: viewRef.current, selectedId: selRef.current,
        userId: userRef.current?.id || null,
      });
    }, 20000);

    const tick = setInterval(() => {
      const idle = Date.now() - lastActivity.current;
      if (idle >= AUTO_LOGOUT_MS) { doLogout(); return; }
      if (idle >= AUTO_LOGOUT_MS - WARNING_MS) {
        setWarn(true);
        setSecLeft(Math.max(0, Math.ceil((AUTO_LOGOUT_MS - idle) / 1000)));
      } else {
        setWarn((w) => (w ? false : w));
      }
    }, 1000);

    return () => {
      events.forEach((e) => window.removeEventListener(e, bump));
      clearInterval(persist);
      clearInterval(tick);
    };
  }, [phase, doLogout]);

  /* ---- ตัวช่วยแก้ไขข้อมูล ---- */
  const updateDebtor = (id, fn) => {
    setData((prev) => ({
      ...prev,
      debtors: prev.debtors.map((d) => (d.id === id ? fn(d) : d)),
    }));
  };

  const saveDebtorForm = (vals) => {
    if (debtorForm.mode === 'add') {
      setData((p) => ({ ...p, debtors: [...p.debtors, { id: uid(), ...vals, createdAt: Date.now(), loans: [] }] }));
    } else {
      updateDebtor(debtorForm.debtor.id, (d) => ({ ...d, ...vals }));
    }
    setDebtorForm(null);
  };

  const saveLoanForm = (vals) => {
    const { debtorId, loan } = loanForm;
    if (loan) {
      updateDebtor(debtorId, (d) => ({
        ...d, loans: d.loans.map((l) => (l.id === loan.id ? { ...l, ...vals } : l)),
      }));
    } else {
      updateDebtor(debtorId, (d) => ({
        ...d, loans: [...(d.loans || []), { id: uid(), ...vals, payments: {} }],
      }));
    }
    setLoanForm(null);
  };

  const savePayment = (vals) => {
    const { debtorId, loanId, month } = paymentForm;
    updateDebtor(debtorId, (d) => ({
      ...d,
      loans: d.loans.map((l) => (l.id === loanId
        ? { ...l, payments: { ...(l.payments || {}), [month]: vals } } : l)),
    }));
    setPaymentForm(null);
  };

  const undoPayment = (debtorId, loanId, month) => {
    setConfirmBox({
      text: `ยกเลิกการบันทึกชำระรอบ ${ymLabel(month)} ?`,
      onYes: () => {
        updateDebtor(debtorId, (d) => ({
          ...d,
          loans: d.loans.map((l) => {
            if (l.id !== loanId) return l;
            const np = { ...(l.payments || {}) };
            delete np[month];
            return { ...l, payments: np };
          }),
        }));
        setConfirmBox(null);
      },
    });
  };

  const deleteDebtor = (debtor) => {
    setConfirmBox({
      text: `ลบลูกหนี้ "${debtor.name}" และข้อมูลทั้งหมด?`,
      onYes: () => {
        setData((p) => ({ ...p, debtors: p.debtors.filter((d) => d.id !== debtor.id) }));
        setSelectedId(null);
        setView('debtors');
        setConfirmBox(null);
      },
    });
  };

  const deleteLoan = (debtor, loan) => {
    setConfirmBox({
      text: `ลบก้อนเงินกู้ ${fmtMoney(loan.principal)} บาท?`,
      onYes: () => {
        updateDebtor(debtor.id, (d) => ({ ...d, loans: d.loans.filter((l) => l.id !== loan.id) }));
        setConfirmBox(null);
      },
    });
  };

  const exportData = async () => {
    try {
      // สำรองเฉพาะข้อมูลลูกหนี้ — ไม่รวมผู้ใช้/รหัสผ่าน
      const backup = { debtors: data.debtors || [], exportedAt: new Date().toISOString() };
      const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `loan-backup-${curYM()}.json`;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
    } catch (e) {}
  };

  const clearAll = () => {
    setConfirmBox({
      text: 'ล้างข้อมูลลูกหนี้ทั้งหมดถาวร? (บัญชีผู้ใช้จะยังอยู่) การกระทำนี้ย้อนกลับไม่ได้',
      onYes: () => {
        setData((p) => ({ ...p, debtors: [] }));   // คงรายชื่อผู้ใช้ไว้
        setConfirmBox(null);
        setSelectedId(null);
        setView('dashboard');
      },
    });
  };

  /* ---- จัดการผู้ใช้งาน ---- */
  const saveUserForm = (out) => {
    if (!userForm) return;
    const { mode, user } = userForm;
    if (mode === 'add') {
      const nu = {
        id: uid(), username: out.username, name: out.name, role: out.role,
        cred: out.cred, createdAt: Date.now(),
      };
      setData((p) => ({ ...p, users: [...(p.users || []), nu] }));
    } else {
      // แก้ไข หรือ เปลี่ยนรหัสผ่าน
      setData((p) => ({
        ...p,
        users: (p.users || []).map((u) => (u.id === user.id ? { ...u, ...out } : u)),
      }));
      // ถ้าแก้ไขบัญชีตัวเอง ให้ปรับ currentUser ตาม
      if (currentUser && user.id === currentUser.id) {
        setCurrentUser((cu) => ({ ...cu, ...out }));
      }
    }
    setUserForm(null);
  };

  const deleteUser = (usr) => {
    const admins = (data.users || []).filter((u) => u.role === 'admin').length;
    if (currentUser && usr.id === currentUser.id) return;          // ลบตัวเองไม่ได้
    if (usr.role === 'admin' && admins <= 1) return;               // ต้องเหลือ admin อย่างน้อย 1
    setConfirmBox({
      text: `ลบผู้ใช้ "${usr.name}" (${usr.username}) ?`,
      onYes: () => {
        setData((p) => ({ ...p, users: (p.users || []).filter((u) => u.id !== usr.id) }));
        setConfirmBox(null);
      },
    });
  };

  /* ---- กู้คืนรหัสผ่านด้วยกุญแจกู้คืน (เรียกจากหน้า Login) ----
     ตั้งรหัสใหม่ + เพิกถอนกุญแจเดิม แล้วเข้าสู่ระบบให้เลย */
  const resetPassword = async (userId, newPw) => {
    const user = (data.users || []).find((u) => u.id === userId);
    if (!user) throw new Error('not-found');
    const cred = await makeCredential(newPw);
    const updated = { ...user, cred, recovery: null };  // กุญแจเดิมใช้ไม่ได้อีก
    setData((p) => ({
      ...p, users: (p.users || []).map((u) => (u.id === userId ? updated : u)),
    }));
    await saveLock({ fails: 0, until: 0 });             // เคลียร์สถานะล็อก
    lastActivity.current = Date.now();
    setCurrentUser(updated);
    setView('dashboard'); setSelectedId(null);
    setPhase('app');
  };

  /* ---- สร้างกุญแจกู้คืน: สุ่มโทเค็น เก็บแฮช ดาวน์โหลดไฟล์จริง ---- */
  const makeRecoveryKey = async () => {
    if (!currentUser) return;
    const token = makeRecoveryToken();
    const recovery = await makeRecovery(token);
    const updated = { ...currentUser, recovery };
    setData((p) => ({
      ...p, users: (p.users || []).map((u) => (u.id === currentUser.id ? { ...u, recovery } : u)),
    }));
    setCurrentUser(updated);
    // ดาวน์โหลดไฟล์กุญแจให้ผู้ใช้เก็บลง USB
    const fileObj = {
      app: 'loan-interest-tracker',
      kind: 'recovery-key',
      username: currentUser.username,
      name: currentUser.name,
      recoveryToken: token,
      createdAt: new Date().toISOString(),
      note: 'เก็บไฟล์นี้ไว้ใน USB ที่ปลอดภัย ใช้สำหรับรีเซ็ตรหัสผ่านเมื่อลืม ห้ามเปิดเผยผู้อื่น',
    };
    try {
      const blob = new Blob([JSON.stringify(fileObj, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `recovery-key-${currentUser.username}.json`;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
    } catch (e) { /* ไม่สามารถดาวน์โหลดได้ — ยังเห็นโทเค็นในหน้าจอ */ }
    setRecoveryInfo({ token, username: currentUser.username });
  };

  /* ---- เรนเดอร์ ---- */
  const fontCss = `@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&display=swap');
  .lt-root,.lt-root *{font-family:'IBM Plex Sans Thai',-apple-system,sans-serif;}
  .lt-pop{animation:ltpop .22s ease-out;}
  @keyframes ltpop{from{opacity:0;transform:translateY(8px) scale(.98);}to{opacity:1;transform:none;}}
  .lt-fade{animation:ltfade .25s ease-out;}
  @keyframes ltfade{from{opacity:0;}to{opacity:1;}}`;

  if (phase === 'loading') {
    return (
      <div className="lt-root min-h-screen flex items-center justify-center bg-cyan-900">
        <style>{fontCss}</style>
        <div className="text-cyan-200 flex flex-col items-center gap-3">
          <Wallet size={40} className="animate-pulse" />
          <div className="text-sm">กำลังโหลดข้อมูล...</div>
        </div>
      </div>
    );
  }

  if (phase === 'login') {
    return (
      <div className="lt-root">
        <style>{fontCss}</style>
        <LoginScreen users={data.users || []} onReset={resetPassword} onLogin={(user) => {
          lastActivity.current = Date.now();
          setCurrentUser(user);
          setView('dashboard'); setSelectedId(null);
          setPhase('app');
        }} />
      </div>
    );
  }

  const selectedDebtor = data.debtors.find((d) => d.id === selectedId) || null;
  const headerTitle = view === 'dashboard' ? 'หน้าหลัก'
    : view === 'debtors' ? 'รายชื่อลูกหนี้'
      : view === 'settings' ? 'ตั้งค่า'
        : view === 'users' ? 'จัดการผู้ใช้งาน' : '';

  return (
    <div className="lt-root min-h-screen bg-stone-100">
      <style>{fontCss}</style>
      <div className="max-w-md mx-auto bg-stone-100 min-h-screen relative">

        {/* ส่วนหัว (ยกเว้นหน้าที่มีหัวของตัวเอง) */}
        {view !== 'debtor' && view !== 'users' && (
          <div className="bg-gradient-to-br from-cyan-800 to-cyan-950 px-4 pt-5 pb-5">
            <div className="flex items-center justify-between">
              <div>
                <div className="text-cyan-200/70 text-xs">FinNote</div>
                <h1 className="text-white text-xl font-bold">{headerTitle}</h1>
              </div>
              <div className="flex items-center gap-2">
                <div className="h-9 w-9 rounded-full bg-white/10 ring-1 ring-white/20 flex items-center justify-center text-white text-sm font-semibold">
                  {(currentUser?.name || '?').charAt(0)}
                </div>
              </div>
            </div>
          </div>
        )}

        <div className="lt-fade" key={view + (selectedId || '')}>
          {view === 'dashboard' && (
            <DashboardView data={data} onOpenDebtor={(id) => { setSelectedId(id); setView('debtor'); }} />
          )}
          {view === 'debtors' && (
            <DebtorsView data={data}
              onOpenDebtor={(id) => { setSelectedId(id); setView('debtor'); }}
              onAdd={() => setDebtorForm({ mode: 'add' })} />
          )}
          {view === 'debtor' && selectedDebtor && (
            <DebtorDetailView
              debtor={selectedDebtor}
              onBack={() => { setView('debtors'); setSelectedId(null); }}
              onEdit={(d) => setDebtorForm({ mode: 'edit', debtor: d })}
              onDelete={deleteDebtor}
              onAddLoan={(d) => setLoanForm({ debtorId: d.id, loan: null })}
              onEditLoan={(d, l) => setLoanForm({ debtorId: d.id, loan: l })}
              onDeleteLoan={deleteLoan}
              onRecord={(loanId, month) => setPaymentForm({ debtorId: selectedDebtor.id, loanId, month })}
              onUndo={(loanId, month) => undoPayment(selectedDebtor.id, loanId, month)}
              onShare={(d) => setShareDebtor(d)}
            />
          )}
          {view === 'debtor' && !selectedDebtor && (
            <div className="p-8 text-center text-slate-400">ไม่พบข้อมูลลูกหนี้</div>
          )}
          {view === 'calc' && (
            <CalcView initName={calcInitName} />
          )}
          {view === 'settings' && (
            <SettingsView data={data} currentUser={currentUser} onLogout={doLogout}
              onClearData={clearAll} onExport={exportData} encOK={encOK}
              onManageUsers={() => setView('users')}
              onRecoveryKey={makeRecoveryKey}
              notifyPerm={notifyPerm} swReady={swReady} onEnableNotify={enableNotifications}
              onRestore={(d) => { setData(d); saveData(d); }}
              onChangePassword={() => setUserForm({ mode: 'password', user: currentUser })} />
          )}
          {view === 'users' && (
            <UsersView users={data.users || []} currentUser={currentUser}
              onBack={() => setView('settings')}
              onAdd={() => setUserForm({ mode: 'add' })}
              onEdit={(u) => setUserForm({ mode: 'edit', user: u })}
              onDelete={deleteUser} />
          )}
        </div>

        {/* ปุ่มลอยเพิ่มลูกหนี้ */}
        {view === 'debtors' && (
          <button onClick={() => setDebtorForm({ mode: 'add' })}
            className="fixed bottom-20 right-4 z-30 h-14 w-14 rounded-full bg-cyan-800 text-white shadow-lg flex items-center justify-center hover:bg-cyan-900 active:scale-95 transition"
            style={{ marginRight: 'max(0px, calc((100vw - 28rem) / 2))' }}>
            <Plus size={26} />
          </button>
        )}

        <BottomNav view={view} setView={(v) => { setView(v); if (v !== 'debtor') setSelectedId(null); }} />
      </div>

      {/* ===== Modals ===== */}
      <Modal open={!!debtorForm} onClose={() => setDebtorForm(null)}
        title={debtorForm?.mode === 'add' ? 'เพิ่มลูกหนี้ใหม่' : 'แก้ไขข้อมูลลูกหนี้'}>
        {debtorForm && <DebtorForm initial={debtorForm.debtor} onSave={saveDebtorForm} />}
      </Modal>

      <Modal open={!!loanForm} onClose={() => setLoanForm(null)}
        title={loanForm?.loan ? 'แก้ไขก้อนเงินกู้' : 'เพิ่มเงินต้น / ก้อนเงินกู้'}>
        {loanForm && <LoanForm initial={loanForm.loan} onSave={saveLoanForm} />}
      </Modal>

      <Modal open={!!paymentForm} onClose={() => setPaymentForm(null)} title="บันทึกการชำระ">
        {paymentForm && (() => {
          const d = data.debtors.find((x) => x.id === paymentForm.debtorId);
          const l = d?.loans.find((x) => x.id === paymentForm.loanId);
          return l ? <PaymentForm loan={l} month={paymentForm.month} onSave={savePayment} /> : null;
        })()}
      </Modal>

      {shareDebtor && <ShareModal debtor={shareDebtor} onClose={() => setShareDebtor(null)} />}

      <Modal open={!!userForm} onClose={() => setUserForm(null)}
        title={userForm?.mode === 'add' ? 'เพิ่มผู้ใช้ใหม่'
          : userForm?.mode === 'password' ? 'เปลี่ยนรหัสผ่าน' : 'แก้ไขผู้ใช้'}>
        {userForm && (
          <UserForm
            mode={userForm.mode}
            initial={userForm.user}
            existingUsernames={(data.users || []).map((u) => u.username)}
            onSave={saveUserForm} />
        )}
      </Modal>

      {/* กล่องแสดงกุญแจกู้คืนหลังสร้างเสร็จ */}
      <Modal open={!!recoveryInfo} onClose={() => setRecoveryInfo(null)} title="กุญแจกู้คืนรหัสผ่าน">
        {recoveryInfo && (
          <div className="space-y-4">
            <div className="bg-cyan-50 rounded-xl p-3 text-sm text-cyan-800">
              สร้างกุญแจกู้คืนสำหรับบัญชี <b>{recoveryInfo.username}</b> เรียบร้อย
              และดาวน์โหลดไฟล์ <b>recovery-key-{recoveryInfo.username}.json</b> แล้ว
            </div>
            <div>
              <div className={labelCls}>กุญแจกู้คืน (จดหรือเก็บไฟล์ไว้)</div>
              <div className="bg-stone-100 rounded-xl px-3 py-3 text-center font-mono text-base font-semibold text-slate-800 tracking-wide break-all">
                {recoveryInfo.token}
              </div>
            </div>
            <div className="bg-amber-50 rounded-xl p-3 text-sm text-amber-700 leading-relaxed">
              <AlertTriangle size={14} className="inline mr-1" />
              นำไฟล์ที่ดาวน์โหลดไปเก็บใน USB หรือที่ปลอดภัย — จะแสดงกุญแจนี้ครั้งเดียว
              หากสร้างชุดใหม่ กุญแจเดิมจะใช้ไม่ได้ทันที และห้ามเปิดเผยให้ผู้อื่น
            </div>
            <PrimaryBtn className="w-full py-3" onClick={() => setRecoveryInfo(null)}>
              <CheckCircle2 size={18} /> เก็บไฟล์เรียบร้อยแล้ว
            </PrimaryBtn>
          </div>
        )}
      </Modal>

      {confirmBox && (
        <div className="fixed inset-0 z-50 flex items-center justify-center px-6">
          <div className="absolute inset-0 bg-slate-900/60 backdrop-blur-sm" onClick={() => setConfirmBox(null)} />
          <div className="relative bg-white rounded-3xl shadow-2xl p-6 w-full max-w-sm text-center lt-pop">
            <div className="inline-flex h-12 w-12 items-center justify-center rounded-2xl bg-red-100 text-red-600 mb-3">
              <AlertTriangle size={24} />
            </div>
            <p className="text-slate-700 font-medium">{confirmBox.text}</p>
            <div className="flex gap-2 mt-5">
              <GhostBtn onClick={() => setConfirmBox(null)} className="flex-1">ยกเลิก</GhostBtn>
              <button onClick={confirmBox.onYes}
                className="flex-1 rounded-xl bg-red-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-red-700 transition">
                ยืนยัน
              </button>
            </div>
          </div>
        </div>
      )}

      {warn && (
        <InactivityModal secLeft={secLeft}
          onStay={() => { lastActivity.current = Date.now(); setWarn(false); }}
          onLeave={doLogout} />
      )}
    </div>
  );
}

if(typeof navigator!=='undefined'&&'serviceWorker' in navigator)
  window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
