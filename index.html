/* ---------------- เครื่องมือเข้ารหัส (Web Crypto) ---------------- */
const _subtleOK = () => typeof window !== 'undefined' && !!(window.crypto && window.crypto.subtle);
let _cryptoKey = null;
async function getKey() {
  if (_cryptoKey) return _cryptoKey;
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey('raw', enc.encode(KDF_SECRET), 'PBKDF2', false, ['deriveKey']);
  _cryptoKey = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: enc.encode(KDF_SALT), iterations: 120000, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']
  );
  return _cryptoKey;
}
function hexFromBuf(buf) {
  return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, '0')).join('');
}
function randHex(bytes) {
  return hexFromBuf(crypto.getRandomValues(new Uint8Array(bytes)).buffer);
}
/* แฮชสำรองกรณีเบราว์เซอร์ไม่รองรับ Web Crypto (FNV-1a สองชุด) */
function fallbackHash(str) {
  let h1 = 0x811c9dc5, h2 = 0xc2b2ae35;
  for (let i = 0; i < str.length; i++) {
    const c = str.charCodeAt(i);
    h1 = Math.imul(h1 ^ c, 16777619);
    h2 = Math.imul(h2 ^ c, 2246822519);
  }
  return (h1 >>> 0).toString(16).padStart(8, '0') + (h2 >>> 0).toString(16).padStart(8, '0');
}
/* แฮชรหัสผ่านด้วย PBKDF2 (เกลือเฉพาะคน + วนซ้ำหลายแสนรอบ) */
async function hashPassword(password, saltHex) {
  if (!_subtleOK()) return 'fb:' + fallbackHash(saltHex + '::' + password);
  const enc = new TextEncoder();
  const salt = Uint8Array.from(saltHex.match(/../g).map((h) => parseInt(h, 16)));
  const base = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits(
    { name: 'PBKDF2', salt, iterations: PW_ITER, hash: 'SHA-256' }, base, 256);
  return hexFromBuf(bits);
}
async function makeCredential(password) {
  const salt = randHex(16);
  return { salt, hash: await hashPassword(password, salt), iter: PW_ITER };
}
/* ตรวจรหัสผ่านแบบเทียบเวลาคงที่ (ลดความเสี่ยง timing attack) */
async function verifyCredential(password, cred) {
  if (!cred || !cred.salt || !cred.hash) return false;
  const h = await hashPassword(password, cred.salt);
  if (h.length !== cred.hash.length) return false;
  let diff = 0;
  for (let i = 0; i < h.length; i++) diff |= h.charCodeAt(i) ^ cred.hash.charCodeAt(i);
  return diff === 0;
}

/* ---- กุญแจกู้คืนรหัสผ่าน (Recovery Key) ----
   แต่ละผู้ใช้มี "โทเค็นกู้คืน" สุ่มขึ้นมา 1 ชุด
   - ตัวโทเค็นจริงถูกดาวน์โหลดเป็นไฟล์ให้เก็บใน USB (เก็บนอกเครื่อง)
   - ในระบบเก็บเพียงค่าแฮชของโทเค็น — ขโมยข้อมูลในเครื่องไปก็รีเซ็ตไม่ได้
   - เวลารีเซ็ต ต้องอัปโหลดไฟล์กุญแจกลับมา ระบบแฮชแล้วเทียบ */
function makeRecoveryToken() {
  // 4 กลุ่ม กลุ่มละ 5 ตัว อ่านง่าย ไม่มีอักขระกำกวม
  const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const buf = crypto.getRandomValues(new Uint8Array(20));
  let out = '';
  for (let i = 0; i < 20; i++) {
    out += A[buf[i] % A.length];
    if (i % 5 === 4 && i < 19) out += '-';
  }
  return out;   // เช่น A7K2M-9PQR4-...
}
async function makeRecovery(token) {
  const salt = randHex(16);
  return { salt, hash: await hashPassword(token, salt), iter: PW_ITER };
}
async function verifyRecovery(token, rec) {
  if (!rec || !rec.salt || !rec.hash || !token) return false;
  const norm = token.trim().toUpperCase().replace(/\s+/g, '');
  const h = await hashPassword(norm, rec.salt);
  if (h.length !== rec.hash.length) return false;
  let diff = 0;
  for (let i = 0; i < h.length; i++) diff |= h.charCodeAt(i) ^ rec.hash.charCodeAt(i);
  return diff === 0;
}
async function encryptObj(obj) {
  try {
    if (!_subtleOK()) throw new Error('no-subtle');
    const key = await getKey();
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const data = new TextEncoder().encode(JSON.stringify(obj));
    const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, data);
    return { v: 1, enc: true, iv: [...iv], ct: [...new Uint8Array(ct)] };
  } catch (e) {
    // กรณีเบราว์เซอร์ไม่รองรับ — เก็บแบบไม่เข้ารหัส (มีคำเตือนใน Settings)
    return { v: 1, enc: false, data: obj };
  }
}
async function decryptObj(blob) {
  if (!blob) return null;
  if (blob.enc === false) return blob.data;
  try {
    const key = await getKey();
    const iv = new Uint8Array(blob.iv);
    const ct = new Uint8Array(blob.ct);
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ct);
    return JSON.parse(new TextDecoder().decode(pt));
  } catch (e) {
    return null;
  }
}

window._syncStatus = 'ok';

function _setSyncStatus(s) {
  window._syncStatus = s;
  window._syncListeners.forEach((fn) => { try { fn(s); } catch (e) {} });
}

const _HEADERS = {
  'apikey': _SUPA_KEY,
  'Authorization': `Bearer ${_SUPA_KEY}`,
  'Content-Type': 'application/json',
};

async function _supaSet(key, val) {
  try {
    _setSyncStatus('syncing');
    const res = await fetch(`${_SUPA_URL}/rest/v1/app_store`, {
      method: 'POST',
      headers: { ..._HEADERS, 'Prefer': 'resolution=merge-duplicates' },
      body: JSON.stringify({ key, value: JSON.stringify(val), updated_at: new Date().toISOString() }),
    });
    if (res.ok) { _setSyncStatus('ok'); return true; }
    _setSyncStatus('error'); return false;
  } catch (e) { _setSyncStatus('offline'); return false; }
}
async function _supaGet(key) {
  try {
    const res = await fetch(
      `${_SUPA_URL}/rest/v1/app_store?key=eq.${encodeURIComponent(key)}&select=value`,
      { headers: _HEADERS }
    );
    if (!res.ok) return null;
    const rows = await res.json();
    if (!rows || !rows.length) return null;
    return JSON.parse(rows[0].value);
  } catch (e) { return null; }
}
async function _supaDel(key) {
  try {
    await fetch(`${_SUPA_URL}/rest/v1/app_store?key=eq.${encodeURIComponent(key)}`, {
      method: 'DELETE', headers: _HEADERS,
    });
  } catch (e) {}
}
/* ทดสอบการเชื่อมต่อ Supabase — เรียกตอนเปิดแอป */
async function _checkSupaConn() {
  try {
    const res = await fetch(`${_SUPA_URL}/rest/v1/app_store?limit=1`, { headers: _HEADERS });
    if (res.ok) { _setSyncStatus('ok'); return true; }
    if (res.status === 404 || res.status === 400) {
      _setSyncStatus('error'); return false;    // ตาราง app_store ยังไม่มี
    }
    _setSyncStatus('error'); return false;
  } catch (e) { _setSyncStatus('offline'); return false; }
}

async function storageSet(key, val) {
  _mem[key] = val;
  try { window.localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
  await _supaSet(key, val);
}
async function storageGet(key) {
  const cloud = await _supaGet(key);
  if (cloud !== null) {
    try { window.localStorage.setItem(key, JSON.stringify(cloud)); } catch (e) {}
    _mem[key] = cloud;
    return cloud;
  }
  try {
    const r = window.localStorage.getItem(key);
    if (r != null) return JSON.parse(r);
  } catch (e) {}
  return key in _mem ? _mem[key] : null;
}
async function storageDel(key) {
  delete _mem[key];
  try { window.localStorage.removeItem(key); } catch (e) {}

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

function ymOf(date) {
  return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;
}
function curYM() { return ymOf(new Date()); }

// วันแจ้งเตือน: วันที่ 25 — ถ้าตรงเสาร์ย้อนเป็น 24 (ศุกร์), ถ้าตรงอาทิตย์ย้อนเป็น 23 (ศุกร์)
function getNotifyDay(year, month1) {
  const d = new Date(year, month1 - 1, 25);
  const dow = d.getDay(); // 0 อาทิตย์ ... 6 เสาร์
  if (dow === 6) return 24;
  if (dow === 0) return 23;
  return 25;
}
function getNotifyDate(year, month1) {
  return new Date(year, month1 - 1, getNotifyDay(year, month1));
}
function nextNotifyDate() {
  const t = new Date(); t.setHours(0, 0, 0, 0);
  const y = t.getFullYear(), m = t.getMonth() + 1;
  const thisOne = getNotifyDate(y, m);
  if (t <= thisOne) return thisOne;
  const nm = m === 12 ? 1 : m + 1, ny = m === 12 ? y + 1 : y;
  return getNotifyDate(ny, nm);
}
function isCollectionPeriod() {
  const t = new Date(); t.setHours(0, 0, 0, 0);
  return t >= getNotifyDate(t.getFullYear(), t.getMonth() + 1);
}

/* ---------------- การแจ้งเตือนบนเบราว์เซอร์ + Service Worker ----------------
   - Notification API ใช้ได้เมื่อเปิดแอปอยู่ (foreground)
   - Service Worker เปิดให้แจ้งเตือนแบบเบื้องหลัง + ใช้งานออฟไลน์
     จะทำงานได้ต่อเมื่อนำไฟล์ทั้งชุด (index.html + sw.js + manifest.json)
     ไปวางบนเว็บโฮสต์จริงที่เป็น HTTPS — ในตัวอย่างนี้จะข้ามไปอย่างนุ่มนวล */
const NOTIFY_FLAG_KEY = 'lt_notified_v1';   // กันแจ้งซ้ำในเดือนเดียวกัน

function notifySupported() {
  return typeof window !== 'undefined' && 'Notification' in window;
}
async function requestNotifyPermission() {
  if (!notifySupported()) return 'unsupported';
  try {
    if (Notification.permission === 'granted') return 'granted';
    if (Notification.permission === 'denied') return 'denied';
    return await Notification.requestPermission();
  } catch (e) {
    return 'unsupported';
  }
}
/* แสดงการแจ้งเตือน — ผ่าน Service Worker ถ้ามี ไม่งั้นใช้ Notification ตรง ๆ */
async function showNotification(title, body) {
  if (!notifySupported() || Notification.permission !== 'granted') return false;
  try {
    if ('serviceWorker' in navigator) {
      const reg = await navigator.serviceWorker.getRegistration();
      if (reg) {
        await reg.showNotification(title, {
          body, tag: 'loan-due', renotify: true,
          badge: undefined, requireInteraction: false,
        });
        return true;
      }
    }
    new Notification(title, { body, tag: 'loan-due' });
    return true;
  } catch (e) {
    return false;
  }
}
/* ลงทะเบียน Service Worker (ใช้ได้เมื่อโฮสต์จริง) */
async function registerServiceWorker() {
  if (typeof navigator === 'undefined' || !('serviceWorker' in navigator)) {
    return { ok: false, reason: 'unsupported' };
  }
  try {
    // ต้องมีไฟล์ sw.js วางอยู่โฟลเดอร์เดียวกับแอป
    const reg = await navigator.serviceWorker.register('./sw.js');
    // ขอ periodic background sync ถ้าเบราว์เซอร์รองรับ (เตือนเบื้องหลังรายวัน)
    try {
      if ('periodicSync' in reg) {
        const status = await navigator.permissions.query({ name: 'periodic-background-sync' });
        if (status.state === 'granted') {
          await reg.periodicSync.register('loan-due-check', { minInterval: 24 * 60 * 60 * 1000 });
        }
      }
    } catch (e) { /* periodic sync ไม่รองรับ — ข้าม */ }
    return { ok: true, reg };
  } catch (e) {
    // ในตัวอย่าง/แซนด์บ็อกซ์จะลงทะเบียนไม่ได้ — ถือว่าปกติ
    return { ok: false, reason: 'blocked' };
  }
}

function monthRange(startYM, endYM) {
  if (!startYM || !endYM || startYM > endYM) return [];
  const [sy, sm] = startYM.split('-').map(Number);
  const [ey, em] = endYM.split('-').map(Number);
  const out = [];
  let y = sy, m = sm;
  while (y < ey || (y === ey && m <= em)) {
    out.push(`${y}-${String(m).padStart(2, '0')}`);
    if (++m > 12) { m = 1; y++; }
  }
  return out;
}
function ymLabel(ym) {
  const [y, m] = ym.split('-').map(Number);
  return `${THAI_MON[m - 1]} ${y + 543}`;
}
function ymLabelFull(ym) {
  const [y, m] = ym.split('-').map(Number);
  return `${THAI_MON_FULL[m - 1]} ${y + 543}`;
}
function fmtMoney(n) {
  const v = Number(n) || 0;
  return v.toLocaleString('th-TH', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
}
function fmtThaiDate(d) {
  if (!d) return '-';
  const dt = (d instanceof Date) ? d : new Date(d);
  if (isNaN(dt)) return '-';
  return `${dt.getDate()} ${THAI_MON[dt.getMonth()]} ${dt.getFullYear() + 543}`;
}

const round2 = (n) => Math.round((Number(n) || 0) * 100) / 100;
const nextYM = (y, m) => (m >= 12 ? [y + 1, 1] : [y, m + 1]);

/* ระบุชนิดเงินกู้ (รองรับข้อมูลเก่าที่ยังไม่มีฟิลด์ type) */
function loanType(loan) {
  if (loan.type) return loan.type;
  return (Number(loan.rate) || 0) > 0 ? 'interest' : 'installment';
}

/* สร้างตารางผ่อนแบบลดต้นลดดอก
   แต่ละเดือน: ดอกเบี้ย = ยอดคงเหลือ × อัตรา, เงินต้นที่ตัด = ยอดผ่อน − ดอกเบี้ย */
function buildAmortSchedule(principal, rate, payment, startMonth) {
  const months = [], scheduleMap = {}, breakdownMap = {};
  let totalInterest = 0, neverPayoff = false;
  const r = rate / 100;
  if (!(principal > 0 && rate > 0 && payment > 0 && startMonth)) {
    return { months, scheduleMap, breakdownMap, totalInterest: 0, neverPayoff: false };
  }
  // ยอดผ่อนต้องมากกว่าดอกเบี้ยงวดแรก มิฉะนั้นหนี้ไม่มีวันหมด
  if (payment <= principal * r + 0.0001) {
    return { months, scheduleMap, breakdownMap, totalInterest: 0, neverPayoff: true };
  }
  let bal = principal;
  let [y, m] = startMonth.split('-').map(Number);
  let guard = 0;
  while (bal > 0.005 && guard < 1200) {
    const interest = bal * r;
    let principalPart = payment - interest;
    if (principalPart >= bal) principalPart = bal;        // งวดสุดท้าย
    const due = round2(principalPart + interest);
    const key = `${y}-${String(m).padStart(2, '0')}`;
    months.push(key);
    scheduleMap[key] = due;
    breakdownMap[key] = {
      interest: round2(interest), principalPart: round2(principalPart),
      balanceBefore: round2(bal), balanceAfter: round2(bal - principalPart),
    };
    totalInterest += interest;
    bal -= principalPart;
    [y, m] = nextYM(y, m);
    guard++;
  }
  return { months, scheduleMap, breakdownMap, totalInterest: round2(totalInterest), neverPayoff };
}

/* สร้างบัญชีรายเดือนแบบมียอดยกมา (carry-forward)
   จ่ายไม่ครบในเดือนหนึ่ง ส่วนที่ขาดจะถูกยกไปรวมกับเดือนถัดไป */
function buildLedger(months, scheduleMap, payments) {
  const rows = [];
  let cumBill = 0, cumPaid = 0;
  months.forEach((m) => {
    const bill = round2(scheduleMap[m] || 0);
    const rec = payments[m];
    const paid = rec ? (Number(rec.amount) || 0) : 0;
    const hasPayment = !!rec;
    const carryIn = round2(cumBill - cumPaid);     // ยอดค้างที่ยกมาจากเดือนก่อน
    const required = round2(Math.max(0, carryIn) + bill); // ยอดที่ควรจ่ายเดือนนี้ (รวมยอดยกมา)
    cumBill = round2(cumBill + bill);
    cumPaid = round2(cumPaid + paid);
    const balanceAfter = round2(cumBill - cumPaid); // ยอดค้างหลังจบเดือนนี้
    let status;
    if (balanceAfter <= 0.005) status = 'settled';        // เคลียร์ครบ (อาจใช้เครดิตจ่ายเกิน)
    else if (paid > 0.005 || carryIn < -0.005) status = 'partial'; // จ่ายบางส่วน หรือมีเครดิตช่วยแต่ไม่พอ
    else status = 'unpaid';                               // ยังไม่จ่ายเลย
    rows.push({ month: m, bill, paid, hasPayment, carryIn, required, balanceAfter, status });
  });
  return rows;
}

/* คำนวณสถานะของแต่ละก้อนเงินกู้ — รองรับ 3 ชนิด
   - interest    : คิดดอกเบี้ยอย่างเดียว เงินต้นคงเดิม
   - installment : ไม่มีดอกเบี้ย ผ่อนเป็นงวด หักเงินต้น
   - amortized   : ลดต้นลดดอก ผ่อนคงที่ ดอกเบี้ยคิดจากยอดคงเหลือ
   ทุกชนิดรองรับการจ่ายไม่ครบ — ส่วนที่ขาดยกไปเดือนถัดไป */
function loanStats(loan, cur) {
  const principal = Number(loan.principal) || 0;
  const rate = Number(loan.rate) || 0;
  const payments = loan.payments || {};
  const kind = loanType(loan);
  let paidTotal = 0;
  Object.values(payments).forEach((p) => { paidTotal += Number(p.amount) || 0; });

  // เตรียมรายชื่อเดือน + ยอดบิลแต่ละเดือน ตามชนิดเงินกู้
  let months = [], scheduleMap = {}, breakdownMap = {};
  let payoffMonth = null, totalInterest = 0, neverPayoff = false;

  if (kind === 'interest') {
    const monthly = round2(principal * rate / 100);
    months = monthRange(loan.startMonth, cur);
    months.forEach((m) => { scheduleMap[m] = monthly; });
  } else if (kind === 'amortized') {
    const payment = Number(loan.payment) || 0;
    const sch = buildAmortSchedule(principal, rate, payment, loan.startMonth);
    months = sch.months; scheduleMap = sch.scheduleMap; breakdownMap = sch.breakdownMap;
    totalInterest = sch.totalInterest; neverPayoff = sch.neverPayoff;
    payoffMonth = months.length ? months[months.length - 1] : null;
  } else {
    const installment = Number(loan.installment) || 0;
    if (installment > 0 && principal > 0 && loan.startMonth) {
      let [y, m] = loan.startMonth.split('-').map(Number);
      let rem = principal, guard = 0;
      while (rem > 0 && guard < 1200) {
        const due = Math.min(installment, rem);
        const key = `${y}-${String(m).padStart(2, '0')}`;
        months.push(key); scheduleMap[key] = round2(due);
        rem -= due; [y, m] = nextYM(y, m); guard++;
      }
    }
    payoffMonth = months.length ? months[months.length - 1] : null;
  }

  // บัญชีรายเดือนพร้อมยอดยกมา
  const ledger = buildLedger(months, scheduleMap, payments);
  const rowOf = {};
  ledger.forEach((r) => { rowOf[r.month] = r; });

  // ยอดค้างจากเดือนก่อนหน้าเดือนปัจจุบัน + เดือนที่ค้าง
  let cumBillBefore = 0, cumPaidBefore = 0, cumBillThru = 0, cumPaidThru = 0;
  const overdueMonths = [];
  ledger.forEach((r) => {
    if (r.month < cur) {
      cumBillBefore += r.bill; cumPaidBefore += r.paid;
      if (r.status !== 'settled') overdueMonths.push(r.month);
    }
    if (r.month <= cur) { cumBillThru += r.bill; cumPaidThru += r.paid; }
  });
  const outstanding = Math.max(0, round2(cumBillBefore - cumPaidBefore));
  const loanDueNow = Math.max(0, round2(cumBillThru - cumPaidThru)); // ยอดที่ต้องชำระรวมถึงเดือนนี้

  const thisRow = rowOf[cur] || null;
  const thisMonthInBilling = !!thisRow;
  const monthly = kind === 'interest'
    ? round2(principal * rate / 100)
    : (kind === 'amortized' ? (Number(loan.payment) || 0) : (Number(loan.installment) || 0));
  const thisMonthBill = thisRow ? thisRow.bill : 0;
  const thisMonthPaidAmt = thisRow ? thisRow.paid : 0;
  const thisMonthHasPayment = thisRow ? thisRow.hasPayment : false;
  const thisMonthSettled = thisRow ? thisRow.status === 'settled' : false;
  const thisMonthRequired = thisRow ? thisRow.required : 0;          // ควรจ่ายเดือนนี้ (รวมยกมา)
  const thisMonthDue = Math.max(0, round2(loanDueNow - outstanding)); // ส่วนของเดือนนี้เอง

  // เงินต้นคงเหลือ + สถานะผ่อนครบ
  let remaining = principal;
  let complete = false;
  if (kind === 'interest') {
    remaining = principal;                       // เงินต้นคงเดิม
  } else if (kind === 'installment') {
    remaining = Math.max(0, round2(principal - paidTotal));
    complete = months.length > 0 && remaining <= 0.005;
  } else { // amortized — นับเงินต้นจากงวดที่เคลียร์ครบแล้ว
    let principalPaid = 0;
    ledger.forEach((r) => {
      if (r.status === 'settled' && breakdownMap[r.month]) {
        principalPaid += breakdownMap[r.month].principalPart;
      }
    });
    remaining = Math.max(0, round2(principal - principalPaid));
    complete = months.length > 0 && ledger.every((r) => r.status === 'settled');
  }

  return {
    kind, principal, rate,
    installment: kind === 'installment' ? (Number(loan.installment) || 0) : 0,
    payment: kind === 'amortized' ? (Number(loan.payment) || 0) : 0,
    monthly, remaining, months, scheduleMap, breakdownMap, payments, paidTotal,
    ledger, rowOf, outstanding, overdueMonths, loanDueNow,
    thisMonthInBilling, thisMonthBill, thisMonthPaidAmt, thisMonthHasPayment,
    thisMonthSettled, thisMonthRequired, thisMonthDue,
    thisMonthPaid: thisMonthSettled,   // คงชื่อเดิมไว้: ถือว่า "จ่ายแล้ว" = เคลียร์ครบ
    complete, payoffMonth, totalInterest, neverPayoff,
  };
}
/* รวมสถานะของลูกหนี้ทั้งคน */
function debtorStats(debtor, cur) {
  const loans = (debtor.loans || []).map((l) => ({ loan: l, s: loanStats(l, cur) }));
  let totalPrincipal = 0, totalRemaining = 0, monthlyInterest = 0,
    monthlyInstallment = 0, paidTotal = 0, outstanding = 0, thisMonthDue = 0, dueNow = 0;
  loans.forEach(({ s }) => {
    totalPrincipal += s.principal;
    totalRemaining += s.remaining;
    if (s.kind === 'interest') monthlyInterest += s.monthly;
    else monthlyInstallment += s.monthly;
    paidTotal += s.paidTotal;
    outstanding += s.outstanding;
    thisMonthDue += s.thisMonthDue;
    dueNow += s.loanDueNow;
  });
  const monthlyDue = monthlyInterest + monthlyInstallment;
  return {
    loans, totalPrincipal, totalRemaining, monthlyInterest, monthlyInstallment,
    monthlyDue, paidTotal, outstanding, thisMonthDue, dueNow: round2(dueNow),
  };
}

    const t = setInterval(() => {
      const lk = lockRef.current;
      if (lk && lk.until > Date.now()) setLockLeft(Math.ceil((lk.until - Date.now()) / 1000));
      else setLockLeft(0);
    }, 1000);
    return () => { alive = false; clearInterval(t); };
  }, []);

  const submit = async () => {
    if (lockLeft > 0 || busy) return;
    setErr('');
    setBusy(true);
    try {
      const uname = u.trim().toLowerCase();
      const user = (users || []).find((x) => (x.username || '').toLowerCase() === uname);
      const ok = user ? await verifyCredential(p, user.cred) : false;
      if (ok) {
        await saveLock({ fails: 0, until: 0 });   // ล็อกอินสำเร็จ — รีเซ็ตตัวนับ
        lockRef.current = { fails: 0, until: 0 };
        onLogin(user);
        return;
      }
      // ล้มเหลว — เพิ่มตัวนับ และล็อกชั่วคราวเมื่อครบเกณฑ์
      const prev = lockRef.current || { fails: 0, until: 0 };
      const fails = (prev.fails || 0) + 1;
      let until = 0;
      if (fails >= LOGIN_MAX_FAILS) {
        const secs = Math.min(300, 30 * (fails - LOGIN_MAX_FAILS + 1)); // 30s, 60s, ... สูงสุด 5 นาที
        until = Date.now() + secs * 1000;
        setLockLeft(secs);
      }
      const rec = { fails, until };
      lockRef.current = rec;
      await saveLock(rec);
      const left = LOGIN_MAX_FAILS - fails;
      setErr(until > Date.now()
        ? 'กรอกผิดหลายครั้งเกินไป — ระบบล็อกชั่วคราว'
        : `ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง${left > 0 ? ` (เหลืออีก ${left} ครั้งก่อนถูกล็อก)` : ''}`);
    } catch (e) {
      setErr('เกิดข้อผิดพลาด กรุณาลองใหม่');
    }
    setBusy(false);
  };

  const locked = lockLeft > 0;

  /* ----- โหมดกู้คืนรหัสผ่าน ----- */
  if (mode === 'recover') {
    return <RecoverPanel users={users} onReset={onReset} onBack={() => { setMode('login'); setErr(''); }} />;
  }

  return (
    <div className="min-h-screen flex flex-col items-center justify-center px-6 bg-gradient-to-br from-emerald-800 to-emerald-950">
      <div className="w-full max-w-sm">
        <div className="text-center mb-8">
          <div className="inline-flex h-16 w-16 items-center justify-center rounded-2xl bg-white/10 ring-1 ring-white/20 mb-4">
            <Wallet size={30} className="text-emerald-200" />
          </div>
          <h1 className="text-2xl font-bold text-white">ระบบจัดการดอกเบี้ยเงินกู้</h1>
          <p className="text-emerald-200/80 text-sm mt-1">เข้าสู่ระบบเพื่อจัดการข้อมูลลูกหนี้</p>
        </div>
        <div className="bg-white rounded-3xl shadow-2xl p-6">
          <div className="mb-4">
            <label className={labelCls}>ชื่อผู้ใช้</label>
            <div className="relative">
              <User size={18} className="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400" />
              <input className={inputCls + ' pl-10'} value={u} placeholder="admin" autoCapitalize="none"
                onChange={(e) => setU(e.target.value)}
                onKeyDown={(e) => e.key === 'Enter' && submit()} />
            </div>
          </div>
          <div className="mb-2">
            <label className={labelCls}>รหัสผ่าน</label>
            <div className="relative">
              <Lock size={18} className="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400" />
              <input className={inputCls + ' pl-10 pr-10'} type={show ? 'text' : 'password'} value={p}
                placeholder="••••••••"
                onChange={(e) => setP(e.target.value)}
                onKeyDown={(e) => e.key === 'Enter' && submit()} />
              <button onClick={() => setShow(!show)}
                className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
                {show ? <EyeOff size={18} /> : <Eye size={18} />}
              </button>
            </div>
          </div>
          {err && (
            <div className="flex items-center gap-2 text-red-600 text-sm mt-3 bg-red-50 rounded-lg px-3 py-2">
              <AlertTriangle size={15} className="shrink-0" /> {err}
            </div>
          )}
          {locked && (
            <div className="flex items-center gap-2 text-amber-700 text-sm mt-2 bg-amber-50 rounded-lg px-3 py-2">
              <Clock size={15} className="shrink-0" /> ลองใหม่ได้ในอีก {lockLeft} วินาที
            </div>
          )}
          <PrimaryBtn onClick={submit} disabled={busy || locked} className="w-full mt-5 py-3">
            {busy ? 'กำลังตรวจสอบ...' : locked ? `ถูกล็อก (${lockLeft}s)` : 'เข้าสู่ระบบ'}
          </PrimaryBtn>
          <button onClick={() => { setMode('recover'); setErr(''); }}
            className="w-full text-center mt-3 text-sm text-emerald-700 font-medium hover:underline">
            ลืมรหัสผ่าน?
          </button>
          <div className="flex items-center gap-1.5 justify-center mt-3 text-xs text-slate-400 text-center">
            <ShieldCheck size={14} className="shrink-0" /> รหัสผ่านเข้ารหัสแบบ PBKDF2 · ออกจากระบบอัตโนมัติใน 5 นาที
          </div>
        </div>
      </div>
    </div>
  );
}

/* ---------------- แผงกู้คืนรหัสผ่านด้วยกุญแจกู้คืน ---------------- */
function RecoverPanel({ users, onReset, onBack }) {
  const [step, setStep] = useState('key');     // key | newpw
  const [username, setUsername] = useState('');
  const [token, setToken] = useState('');
  const [matched, setMatched] = useState(null); // ผู้ใช้ที่ยืนยันแล้ว
  const [pw, setPw] = useState('');
  const [pw2, setPw2] = useState('');
  const [show, setShow] = useState(false);
  const [err, setErr] = useState('');
  const [busy, setBusy] = useState(false);
  const fileRef = useRef(null);

  // อ่านไฟล์กุญแจกู้คืน (.json) แล้วเติมช่องให้อัตโนมัติ
  const readFile = (file) => {
    if (!file) return;
    const fr = new FileReader();
    fr.onload = () => {
      try {
        const obj = JSON.parse(String(fr.result));
        if (obj && obj.username) setUsername(obj.username);
        if (obj && obj.recoveryToken) setToken(obj.recoveryToken);
        setErr('');
      } catch (e) {
        setErr('ไฟล์กุญแจไม่ถูกต้อง — กรุณาเลือกไฟล์ที่ดาวน์โหลดจากระบบ');
      }
    };
    fr.readAsText(file);
  };

  const verifyKey = async () => {
    setErr(''); setBusy(true);
    try {
      const uname = username.trim().toLowerCase();
      const user = (users || []).find((x) => (x.username || '').toLowerCase() === uname);
      if (!user || !user.recovery) {
        setErr('ไม่พบบัญชีนี้ หรือบัญชีนี้ยังไม่ได้ตั้งกุญแจกู้คืน');
        setBusy(false); return;
      }
      const ok = await verifyRecovery(token, user.recovery);
      if (!ok) {
        setErr('กุญแจกู้คืนไม่ถูกต้อง');
        setBusy(false); return;
      }
      setMatched(user);
      setStep('newpw');
    } catch (e) {
      setErr('เกิดข้อผิดพลาด กรุณาลองใหม่');
    }
    setBusy(false);
  };

  const doReset = async () => {
    setErr('');
    if (pw.length < 6) { setErr('รหัสผ่านใหม่ต้องยาวอย่างน้อย 6 ตัวอักษร'); return; }
    if (pw !== pw2) { setErr('รหัสผ่านทั้งสองช่องไม่ตรงกัน'); return; }
    setBusy(true);
    try {
      await onReset(matched.id, pw);   // App จะตั้งรหัสใหม่ + เพิกถอนกุญแจเดิม
    } catch (e) {
      setErr('เกิดข้อผิดพลาด กรุณาลองใหม่');
      setBusy(false);
    }
  };

  return (
    <div className="min-h-screen flex flex-col items-center justify-center px-6 bg-gradient-to-br from-emerald-800 to-emerald-950">
      <div className="w-full max-w-sm">
        <div className="text-center mb-6">
          <div className="inline-flex h-16 w-16 items-center justify-center rounded-2xl bg-white/10 ring-1 ring-white/20 mb-4">
            <KeyRound size={28} className="text-emerald-200" />
          </div>
          <h1 className="text-xl font-bold text-white">กู้คืนรหัสผ่าน</h1>
          <p className="text-emerald-200/80 text-sm mt-1">
            {step === 'key' ? 'ใช้ไฟล์กุญแจกู้คืนที่เก็บไว้ใน USB' : 'ตั้งรหัสผ่านใหม่'}
          </p>
        </div>
        <div className="bg-white rounded-3xl shadow-2xl p-6">
          {step === 'key' ? (
            <>
              <div className="mb-4">
                <label className={labelCls}>ชื่อผู้ใช้</label>
                <input className={inputCls} value={username} autoCapitalize="none"
                  onChange={(e) => setUsername(e.target.value)} placeholder="admin" />
              </div>
              <div className="mb-3">
                <label className={labelCls}>กุญแจกู้คืน</label>
                <input className={inputCls} value={token} autoCapitalize="characters"
                  onChange={(e) => setToken(e.target.value)} placeholder="เช่น A7K2M-9PQR4-..." />
              </div>
              <input ref={fileRef} type="file" accept="application/json,.json" className="hidden"
                onChange={(e) => readFile(e.target.files?.[0])} />
              <GhostBtn onClick={() => fileRef.current?.click()} className="w-full mb-2">
                <FileDown size={15} className="rotate-180" /> เลือกไฟล์กุญแจจาก USB
              </GhostBtn>
              <p className="text-xs text-slate-400 mb-3">
                เสียบ USB ที่เก็บไฟล์กุญแจ แล้วเลือกไฟล์ — ระบบจะเติมช่องให้อัตโนมัติ
                หรือพิมพ์กุญแจเองก็ได้
              </p>
              {err && (
                <div className="flex items-center gap-2 text-red-600 text-sm mb-3 bg-red-50 rounded-lg px-3 py-2">
                  <AlertTriangle size={15} className="shrink-0" /> {err}
                </div>
              )}
              <PrimaryBtn onClick={verifyKey} disabled={busy || !username.trim() || !token.trim()}
                className="w-full py-3">
                {busy ? 'กำลังตรวจสอบ...' : 'ตรวจสอบกุญแจ'}
              </PrimaryBtn>
            </>
          ) : (
            <>
              <div className="bg-emerald-50 rounded-xl p-3 text-sm text-emerald-800 mb-4">
                ยืนยันตัวตนสำเร็จ — บัญชี <b>{matched?.username}</b><br />
                <span className="text-xs">ตั้งรหัสผ่านใหม่ได้เลย กุญแจกู้คืนชุดเดิมจะถูกยกเลิกเพื่อความปลอดภัย</span>
              </div>
              <div className="mb-3">
                <label className={labelCls}>รหัสผ่านใหม่</label>
                <div className="relative">
                  <input className={inputCls + ' pr-10'} type={show ? 'text' : 'password'} value={pw}
                    onChange={(e) => setPw(e.target.value)} placeholder="อย่างน้อย 6 ตัวอักษร" />
                  <button onClick={() => setShow(!show)}
                    className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
                    {show ? <EyeOff size={18} /> : <Eye size={18} />}
                  </button>
                </div>
              </div>
              <div className="mb-3">
                <label className={labelCls}>ยืนยันรหัสผ่านใหม่</label>
                <input className={inputCls} type={show ? 'text' : 'password'} value={pw2}
                  onChange={(e) => setPw2(e.target.value)} placeholder="พิมพ์รหัสผ่านอีกครั้ง" />
              </div>
              {err && (
                <div className="flex items-center gap-2 text-red-600 text-sm mb-3 bg-red-50 rounded-lg px-3 py-2">
                  <AlertTriangle size={15} className="shrink-0" /> {err}
                </div>
              )}
              <PrimaryBtn onClick={doReset} disabled={busy} className="w-full py-3">
                {busy ? 'กำลังบันทึก...' : 'ตั้งรหัสผ่านใหม่และเข้าสู่ระบบ'}
              </PrimaryBtn>
            </>
          )}
          <button onClick={onBack}
            className="w-full text-center mt-3 text-sm text-slate-500 font-medium hover:underline">
            ← กลับไปหน้าเข้าสู่ระบบ
          </button>
        </div>
      </div>
    </div>
  );
}

/* ---------------- หน้าหลัก (Dashboard) ---------------- */
function DashboardView({ data, onOpenDebtor }) {
  const cur = curYM();
  const agg = useMemo(() => {
    let principal = 0, collected = 0, outstanding = 0, thisMonth = 0;
    const dueList = [];
    (data.debtors || []).forEach((d) => {
      const s = debtorStats(d, cur);
      principal += s.totalPrincipal;
      collected += s.paidTotal;
      outstanding += s.outstanding;
      thisMonth += s.thisMonthDue;
      if (s.dueNow > 0) dueList.push({ debtor: d, s });
    });
    dueList.sort((a, b) => b.s.dueNow - a.s.dueNow);
    return { principal, collected, outstanding, thisMonth, dueList };

                  <Pill tone="slate">เก็บ/เดือน {fmtMoney(s.monthlyDue)}</Pill>

                    ? <Pill tone="red">ค้าง {fmtMoney(s.outstanding)}</Pill>
                    : <Pill tone="green">ไม่มียอดค้าง</Pill>}
                </div>
              </button>
            );
          })}
        </div>
      )}
    </div>
  );
}

/* ---------------- ตารางรอบบิลของก้อนเงินกู้ ---------------- */
function LoanLedger({ loan, cur, onRecord, onUndo }) {
  const [open, setOpen] = useState(false);
  const s = loanStats(loan, cur);
  const monthsDesc = [...s.ledger].reverse();
  return (
    <div className="mt-3 border-t border-stone-100 pt-3">
      <button onClick={() => setOpen(!open)} className="flex items-center gap-1.5 text-sm font-medium text-emerald-700">
        {open ? <ChevronUp size={15} /> : <ChevronDown size={15} />}
        ตารางรอบบิล ({s.months.length} เดือน)
      </button>
      {open && (
        <div className="mt-2 space-y-1.5">
          {monthsDesc.length === 0 && <div className="text-sm text-slate-400">ยังไม่ถึงรอบบิลแรก</div>}
          {monthsDesc.map((r) => {
            const m = r.month;
            const isCur = m === cur;
            const bd = s.breakdownMap[m];   // รายละเอียดลดต้นลดดอก (ถ้ามี)
            const tone = r.status === 'settled' ? 'emerald'
              : r.status === 'partial' ? 'amber' : 'slate';
            return (
              <div key={m} className="flex items-center justify-between bg-stone-50 rounded-xl px-3 py-2">
                <div className="min-w-0">
                  <div className="text-sm font-medium text-slate-700">
                    {ymLabel(m)} {isCur && <span className="text-emerald-600">(เดือนนี้)</span>}
                  </div>
                  <div className="text-xs text-slate-400">
                    บิล {fmtMoney(r.bill)}
                    {r.carryIn > 0.005 && <span className="text-amber-600"> · ยกมา {fmtMoney(r.carryIn)}</span>}
                    {r.hasPayment && <> · ชำระ {fmtMoney(r.paid)}</>}
                  </div>
                  {r.status === 'partial' && (
                    <div className="text-xs text-amber-600 mt-0.5">
                      ขาดอีก {fmtMoney(r.balanceAfter)} — ยกไปเดือนถัดไป
                    </div>
                  )}
                  {bd && (
                    <div className="text-xs text-slate-400 mt-0.5">
                      ดอกเบี้ย {fmtMoney(bd.interest)} · เงินต้น {fmtMoney(bd.principalPart)} · คงเหลือ {fmtMoney(bd.balanceAfter)}
                    </div>
                  )}
                </div>
                {r.status === 'settled' ? (
                  <button onClick={() => r.hasPayment && onUndo(loan.id, m)}
                    className="flex items-center gap-1 text-xs text-emerald-700 font-medium bg-emerald-50 px-2.5 py-1.5 rounded-lg shrink-0">
                    <CheckCircle2 size={14} /> {r.hasPayment ? 'ชำระแล้ว' : 'เคลียร์แล้ว'}
                  </button>
                ) : (
                  <button onClick={() => onRecord(loan.id, m)}
                    className={`text-xs font-medium px-2.5 py-1.5 rounded-lg shrink-0 ${
                      tone === 'amber' ? 'text-amber-700 bg-amber-50'
                        : isCur ? 'text-emerald-700 bg-emerald-50' : 'text-amber-700 bg-amber-50'}`}>
                    {r.status === 'partial' ? 'จ่ายเพิ่ม' : 'บันทึกชำระ'}
                  </button>
                )}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

/* ---------------- หน้ารายละเอียดลูกหนี้ ---------------- */

  const s = debtorStats(debtor, cur);

  return (

          <button onClick={onBack} className="p-2 -ml-2 rounded-lg text-white/90 hover:bg-white/10">
            <ChevronLeft size={22} />
          </button>
          <div className="flex gap-1">
            <button onClick={() => onEdit(debtor)} className="p-2 rounded-lg text-white/90 hover:bg-white/10"><Pencil size={18} /></button>
            <button onClick={() => onDelete(debtor)} className="p-2 rounded-lg text-white/90 hover:bg-white/10"><Trash2 size={18} /></button>
          </div>
        </div>
        <div className="flex items-center gap-3 mt-1">
          <div className="h-14 w-14 rounded-2xl bg-white/15 ring-1 ring-white/20 flex items-center justify-center text-2xl font-bold text-white">
            {debtor.name.charAt(0)}
          </div>
          <div>
            <h2 className="text-xl font-bold text-white">{debtor.name}</h2>
            {debtor.phone && <div className="flex items-center gap-1.5 text-emerald-200/90 text-sm mt-0.5"><Phone size={13} /> {debtor.phone}</div>}
          </div>
        </div>
      </div>

      {/* การ์ดสรุปยอด */}
      <div className="px-4 -mt-4">
        <div className="bg-white rounded-2xl border border-stone-200 shadow-sm p-4 grid grid-cols-3 divide-x divide-stone-100">
          <div className="px-1">
            <div className="text-xs text-slate-400">จ่ายมาแล้ว</div>
            <div className="text-sm font-bold text-emerald-700 tabular-nums">{fmtMoney(s.paidTotal)}</div>
          </div>
          <div className="px-2">
            <div className="text-xs text-slate-400">รอบนี้</div>
            <div className="text-sm font-bold text-slate-800 tabular-nums">{fmtMoney(s.thisMonthDue)}</div>
          </div>
          <div className="px-2">
            <div className="text-xs text-slate-400">ค้างชำระ</div>
            <div className={`text-sm font-bold tabular-nums ${s.outstanding > 0 ? 'text-red-600' : 'text-slate-800'}`}>{fmtMoney(s.outstanding)}</div>
          </div>
        </div>
      </div>

      {/* ปุ่มแชร์ไลน์ */}
      <div className="px-4 mt-3">
        <PrimaryBtn onClick={() => onShare(debtor)} className="w-full py-3 bg-emerald-700">
          <Share2 size={18} /> แชร์สรุปยอดผ่านไลน์
        </PrimaryBtn>
      </div>

      {/* ยอดค้างเตือน */}
      {s.outstanding > 0 && (
        <div className="px-4 mt-3">
          <div className="bg-red-50 border border-red-200 rounded-2xl p-3.5 flex items-center gap-3">
            <AlertTriangle size={20} className="text-red-500 shrink-0" />
            <div className="text-sm text-red-700">
              มียอดค้างจากเดือนก่อน รวม <b>{fmtMoney(s.outstanding)} บาท</b> — กรุณาติดตาม
            </div>
          </div>
        </div>
      )}

      {/* รายการก้อนเงินกู้ */}
      <div className="px-4 mt-4">
        <div className="flex items-center justify-between mb-2">
          <h3 className="font-semibold text-slate-700">เงินต้น / ก้อนเงินกู้ ({s.loans.length})</h3>
          <button onClick={() => onAddLoan(debtor)} className="flex items-center gap-1 text-sm font-medium text-emerald-700">
            <Plus size={16} /> เพิ่มก้อน
          </button>
        </div>

        {s.loans.length === 0 && (
          <div className="bg-white rounded-2xl border border-dashed border-stone-300 p-6 text-center text-slate-400 text-sm">
            ยังไม่มีก้อนเงินกู้ — แตะ "เพิ่มก้อน" เพื่อระบุเงินต้นและอัตราดอกเบี้ย
          </div>
        )}

        <div className="space-y-3">
          {s.loans.map(({ loan, s: ls }) => {
            const isInst = ls.kind === 'installment';
            const isAmort = ls.kind === 'amortized';
            const isInterest = ls.kind === 'interest';
            const reduces = isInst || isAmort;   // เงินต้นลดลงได้
            const pct = reduces && ls.principal > 0
              ? Math.min(100, Math.round(((ls.principal - ls.remaining) / ls.principal) * 100)) : 0;
            const monthLabel = isInterest ? 'ดอกเบี้ย/เดือน' : 'ผ่อน/เดือน';
            return (
            <div key={loan.id} className="bg-white rounded-2xl border border-stone-200 shadow-sm p-4">
              <div className="flex items-start justify-between">
                <div>
                  <div className="flex items-center gap-2 flex-wrap">
                    <span className="text-lg font-bold text-slate-800 tabular-nums">{fmtMoney(ls.principal)}</span>
                    <span className="text-xs text-slate-400">บาท</span>
                    {isInst && <Pill tone="slate">ไม่มีดอกเบี้ย</Pill>}
                    {isAmort && <Pill tone="green"><BadgePercent size={12} /> ลดต้นลดดอก {ls.rate}%</Pill>}
                    {isInterest && <Pill tone="green"><BadgePercent size={12} /> {ls.rate}% / เดือน</Pill>}
                    {ls.complete && <Pill tone="green"><CheckCircle2 size={12} /> ผ่อนครบแล้ว</Pill>}
                  </div>
                  <div className="text-xs text-slate-400 mt-0.5">
                    เริ่ม {ymLabel(loan.startMonth)} {loan.note && `· ${loan.note}`}
                  </div>
                </div>
                <div className="flex gap-1">
                  <button onClick={() => onEditLoan(debtor, loan)} className="p-1.5 rounded-lg hover:bg-stone-100 text-slate-400"><Pencil size={15} /></button>
                  <button onClick={() => onDeleteLoan(debtor, loan)} className="p-1.5 rounded-lg hover:bg-stone-100 text-slate-400"><Trash2 size={15} /></button>
                </div>
              </div>

              <div className="grid grid-cols-3 gap-2 mt-3">
                <div className="bg-stone-50 rounded-xl p-2.5">
                  <div className="text-xs text-slate-400">{monthLabel}</div>
                  <div className="text-sm font-semibold text-slate-800 tabular-nums">{fmtMoney(ls.monthly)}</div>
                </div>
                <div className="bg-emerald-50 rounded-xl p-2.5">
                  <div className="text-xs text-emerald-600">{reduces ? 'เงินต้นคงเหลือ' : 'จ่ายสะสม'}</div>
                  <div className="text-sm font-semibold text-emerald-700 tabular-nums">{fmtMoney(reduces ? ls.remaining : ls.paidTotal)}</div>
                </div>
                <div className={`rounded-xl p-2.5 ${ls.outstanding > 0 ? 'bg-red-50' : 'bg-stone-50'}`}>
                  <div className={`text-xs ${ls.outstanding > 0 ? 'text-red-500' : 'text-slate-400'}`}>ค้างชำระ</div>
                  <div className={`text-sm font-semibold tabular-nums ${ls.outstanding > 0 ? 'text-red-600' : 'text-slate-800'}`}>{fmtMoney(ls.outstanding)}</div>
                </div>
              </div>

              {/* ข้อมูลแผนผ่อน (เงินต้นลดลงได้) */}
              {reduces && (
                <div className="mt-3">
                  <div className="flex justify-between text-xs text-slate-500 mb-1">
                    <span>ผ่อนเงินต้นไปแล้ว {fmtMoney(ls.principal - ls.remaining)} / {fmtMoney(ls.principal)} บาท</span>
                    <span className="tabular-nums">{pct}%</span>
                  </div>
                  <div className="h-2 rounded-full bg-stone-100 overflow-hidden">
                    <div className="h-full bg-emerald-600 rounded-full transition-all" style={{ width: `${pct}%` }} />
                  </div>
                  {ls.payoffMonth && (
                    <div className="text-xs text-slate-500 mt-2 flex flex-wrap gap-x-4 gap-y-0.5">
                      <span>ผ่อนหมดเดือน <b className="text-slate-700">{ymLabel(ls.payoffMonth)}</b></span>
                      {isAmort && <span>ดอกเบี้ยรวม <b className="text-slate-700">{fmtMoney(ls.totalInterest)} บาท</b></span>}
                    </div>
                  )}
                </div>
              )}

              {/* สถานะเดือนนี้ */}
              {ls.thisMonthInBilling && (
                <div className="mt-3 bg-emerald-50/60 rounded-xl px-3 py-2.5">
                  <div className="flex items-center justify-between">
                    <div className="text-sm text-slate-600">
                      {isInterest ? 'ดอกเบี้ยเดือนนี้' : 'ค่างวดเดือนนี้'} ({ymLabel(cur)})
                    </div>
                    {ls.thisMonthSettled ? (
                      <Pill tone="green"><CheckCircle2 size={13} /> ชำระครบแล้ว</Pill>
                    ) : (
                      <button onClick={() => onRecord(loan.id, cur)}
                        className="text-sm font-semibold text-white bg-emerald-700 px-3 py-1.5 rounded-lg">
                        {ls.thisMonthHasPayment ? 'จ่ายเพิ่ม' : 'บันทึกชำระ'} {fmtMoney(ls.loanDueNow)}
                      </button>
                    )}
                  </div>
                  {/* แจกแจงยอด เมื่อมียอดยกมา หรือ จ่ายมาบางส่วน */}
                  {!ls.thisMonthSettled && (ls.outstanding > 0.005 || ls.thisMonthHasPayment) && (
                    <div className="text-xs text-slate-500 mt-1.5 leading-relaxed">
                      บิลเดือนนี้ {fmtMoney(ls.thisMonthBill)}
                      {ls.outstanding > 0.005 && <span className="text-amber-600"> + ยกมา {fmtMoney(ls.outstanding)}</span>}
                      {ls.thisMonthHasPayment && <span className="text-emerald-600"> − จ่ายแล้ว {fmtMoney(ls.thisMonthPaidAmt)}</span>}
                      {' = ค้าง '}<b className="text-slate-700">{fmtMoney(ls.loanDueNow)} บาท</b>
                    </div>
                  )}
                </div>
              )}

              <LoanLedger loan={loan} cur={cur} onRecord={onRecord} onUndo={onUndo} />
            </div>
          );
          })}
        </div>
      </div>
    </div>
  );
}

/* ---------------- ฟอร์มเพิ่ม/แก้ไขผู้ใช้ ---------------- */
function UserForm({ initial, existingUsernames, mode, onSave }) {
  const isEdit = mode === 'edit';
  const isChangePw = mode === 'password';
  const [username, setUsername] = useState(initial?.username || '');
  const [name, setName] = useState(initial?.name || '');
  const [role, setRole] = useState(initial?.role || 'staff');
  const [pw, setPw] = useState('');
  const [pw2, setPw2] = useState('');
  const [show, setShow] = useState(false);
  const [err, setErr] = useState('');
  const [busy, setBusy] = useState(false);

  const submit = async () => {
    setErr('');
    const uname = username.trim().toLowerCase();
    if (!isChangePw) {
      if (!name.trim()) { setErr('กรุณากรอกชื่อ'); return; }
      if (!uname) { setErr('กรุณากรอกชื่อผู้ใช้'); return; }
      if (!/^[a-z0-9_.]{3,}$/.test(uname)) {
        setErr('ชื่อผู้ใช้ต้องยาว 3 ตัวขึ้นไป (a-z, 0-9, _ . เท่านั้น)'); return;
      }
      const dup = (existingUsernames || []).some(
        (x) => x.toLowerCase() === uname && x.toLowerCase() !== (initial?.username || '').toLowerCase());
      if (dup) { setErr('ชื่อผู้ใช้นี้มีอยู่แล้ว'); return; }
    }
    // รหัสผ่าน: บังคับตอนเพิ่มใหม่/เปลี่ยนรหัส, ไม่บังคับตอนแก้ไข
    const needPw = !isEdit || pw.length > 0;
    if (needPw) {
      if (pw.length < 6) { setErr('รหัสผ่านต้องยาวอย่างน้อย 6 ตัวอักษร'); return; }
      if (pw !== pw2) { setErr('รหัสผ่านทั้งสองช่องไม่ตรงกัน'); return; }
    }
    setBusy(true);
    try {
      const out = {};
      if (!isChangePw) { out.username = uname; out.name = name.trim(); out.role = role; }
      if (needPw || isChangePw) out.cred = await makeCredential(pw);
      onSave(out);
    } catch (e) {
      setErr('เกิดข้อผิดพลาด กรุณาลองใหม่');
      setBusy(false);
    }
  };

  return (
    <div className="space-y-4">
      {!isChangePw && (
        <>
          <div>
            <label className={labelCls}>ชื่อ-นามสกุล *</label>
            <input className={inputCls} value={name} onChange={(e) => setName(e.target.value)} placeholder="เช่น สมหญิง รักงาน" />
          </div>
          <div>
            <label className={labelCls}>ชื่อผู้ใช้ (สำหรับเข้าสู่ระบบ) *</label>
            <input className={inputCls} value={username} autoCapitalize="none"
              onChange={(e) => setUsername(e.target.value)} placeholder="เช่น somying" />
          </div>
          <div>
            <label className={labelCls}>สิทธิ์การใช้งาน *</label>
            <div className="grid grid-cols-2 gap-2">
              {[{ id: 'staff', label: 'พนักงาน' }, { id: 'admin', label: 'ผู้ดูแลระบบ' }].map((o) => (
                <button key={o.id} onClick={() => setRole(o.id)}
                  className={`rounded-xl py-2.5 text-sm font-semibold border transition ${
                    role === o.id ? 'bg-emerald-800 text-white border-emerald-800'
                      : 'bg-white text-slate-600 border-stone-300'}`}>
                  {o.label}
                </button>
              ))}
            </div>
            <div className="text-xs text-slate-400 mt-1.5">
              ผู้ดูแลระบบจัดการผู้ใช้และล้างข้อมูลได้ · พนักงานจัดการเฉพาะลูกหนี้
            </div>
          </div>
        </>
      )}
      <div>
        <label className={labelCls}>
          {isChangePw ? 'รหัสผ่านใหม่ *' : isEdit ? 'รหัสผ่านใหม่ (เว้นว่างถ้าไม่เปลี่ยน)' : 'รหัสผ่าน *'}
        </label>
        <div className="relative">
          <input className={inputCls + ' pr-10'} type={show ? 'text' : 'password'} value={pw}
            onChange={(e) => setPw(e.target.value)} placeholder="อย่างน้อย 6 ตัวอักษร" />
          <button onClick={() => setShow(!show)}
            className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
            {show ? <EyeOff size={18} /> : <Eye size={18} />}
          </button>
        </div>
      </div>
      {(pw.length > 0 || !isEdit || isChangePw) && (
        <div>
          <label className={labelCls}>ยืนยันรหัสผ่าน{isChangePw || !isEdit ? ' *' : ''}</label>
          <input className={inputCls} type={show ? 'text' : 'password'} value={pw2}
            onChange={(e) => setPw2(e.target.value)} placeholder="พิมพ์รหัสผ่านอีกครั้ง" />
        </div>
      )}
      {err && <div className="text-red-600 text-sm flex items-center gap-1.5"><AlertTriangle size={14} /> {err}</div>}
      <PrimaryBtn className="w-full py-3" onClick={submit} disabled={busy}>
        {busy ? 'กำลังบันทึก...' : 'บันทึก'}
      </PrimaryBtn>
    </div>
  );
}

/* ---------------- ฟอร์มเพิ่ม/แก้ไขก้อนเงินกู้ ---------------- */
function LoanForm({ initial, onSave }) {
  const [type, setType] = useState(initial ? loanType(initial) : 'interest');
  const [principal, setPrincipal] = useState(initial ? String(initial.principal) : '');
  const [rate, setRate] = useState(initial && Number(initial.rate) > 0 ? Number(initial.rate) : 5);
  const [installment, setInstallment] = useState(
    initial && initial.installment ? String(initial.installment) : '1000');
  const [payment, setPayment] = useState(
    initial && initial.payment ? String(initial.payment) : '');
  const [startMonth, setStartMonth] = useState(initial?.startMonth || curYM());
  const [note, setNote] = useState(initial?.note || '');
  const [err, setErr] = useState('');

  const p = Number(principal) || 0;
  const inst = Number(installment) || 0;
  const pay = Number(payment) || 0;

  // พรีวิวเงินกู้ไม่มีดอกเบี้ย
  const numInstallments = type === 'installment' && inst > 0 ? Math.ceil(p / inst) : 0;
  const lastAmt = numInstallments > 0 ? p - inst * (numInstallments - 1) : 0;
  // พรีวิวลดต้นลดดอก
  const amort = useMemo(
    () => (type === 'amortized' ? buildAmortSchedule(p, rate, pay, startMonth) : null),
    [type, p, rate, pay, startMonth]);

  const TYPES = [
    { id: 'interest', label: 'ดอกเบี้ยอย่างเดียว' },
    { id: 'amortized', label: 'ลดต้นลดดอก' },
    { id: 'installment', label: 'ไม่มีดอกเบี้ย' },
  ];

  return (
    <div className="space-y-4">
      <div>
        <label className={labelCls}>ประเภทเงินกู้ *</label>
        <div className="grid grid-cols-3 gap-2">
          {TYPES.map((t) => (
            <button key={t.id} onClick={() => setType(t.id)}
              className={`rounded-xl py-2 px-1 text-xs font-semibold border transition ${
                type === t.id ? 'bg-emerald-800 text-white border-emerald-800'
                  : 'bg-white text-slate-600 border-stone-300'}`}>
              {t.label}
            </button>
          ))}
        </div>
        <div className="text-xs text-slate-400 mt-1.5">
          {type === 'interest' && 'จ่ายดอกเบี้ยทุกเดือน เงินต้นคงเดิม'}
          {type === 'amortized' && 'ผ่อนคงที่ทุกเดือน ดอกเบี้ยคิดจากยอดคงเหลือ เงินต้นลดลงเรื่อย ๆ'}
          {type === 'installment' && 'ไม่มีดอกเบี้ย ผ่อนเป็นงวด หักจากเงินต้น'}
        </div>
      </div>

      <div>
        <label className={labelCls}>เงินต้น (บาท) *</label>
        <input className={inputCls} value={principal} inputMode="numeric"
          onChange={(e) => setPrincipal(e.target.value.replace(/[^\d.]/g, ''))} placeholder="เช่น 50000" />
      </div>

      {type !== 'installment' && (
        <div>
          <label className={labelCls}>อัตราดอกเบี้ยต่อเดือน *</label>
          <div className="grid grid-cols-3 gap-2">
            {RATE_OPTIONS.map((r) => (
              <button key={r} onClick={() => setRate(r)}
                className={`rounded-xl py-2.5 text-sm font-semibold border transition ${
                  rate === r ? 'bg-emerald-800 text-white border-emerald-800'
                    : 'bg-white text-slate-600 border-stone-300'}`}>
                {r}%
              </button>
            ))}
          </div>
        </div>
      )}

      {type === 'installment' && (
        <div>
          <label className={labelCls}>ยอดผ่อนต่อเดือน (บาท) *</label>
          <input className={inputCls} value={installment} inputMode="numeric"
            onChange={(e) => setInstallment(e.target.value.replace(/[^\d.]/g, ''))} placeholder="เช่น 1000" />
        </div>
      )}

      {type === 'amortized' && (
        <div>
          <label className={labelCls}>ยอดผ่อนต่อเดือน (บาท) *</label>
          <input className={inputCls} value={payment} inputMode="numeric"
            onChange={(e) => setPayment(e.target.value.replace(/[^\d.]/g, ''))} placeholder="เช่น 8000" />
          <div className="text-xs text-slate-400 mt-1">ยอดนี้รวมดอกเบี้ย + เงินต้นในแต่ละเดือน</div>
        </div>
      )}

      <div>
        <label className={labelCls}>{type === 'interest' ? 'เดือนที่เริ่มคิดดอกเบี้ย *' : 'เดือนที่เริ่มผ่อน *'}</label>
        <input type="month" className={inputCls} value={startMonth} onChange={(e) => setStartMonth(e.target.value)} />
      </div>
      <div>
        <label className={labelCls}>หมายเหตุ</label>
        <input className={inputCls} value={note} onChange={(e) => setNote(e.target.value)} placeholder="เช่น ก้อนที่ 2" />
      </div>

      {/* กล่องพรีวิว */}
      {p > 0 && type === 'interest' && (
        <div className="bg-emerald-50 rounded-xl p-3 text-sm text-emerald-800">
          ดอกเบี้ยต่อเดือน = <b>{fmtMoney(p * rate / 100)} บาท</b>
        </div>
      )}
      {p > 0 && type === 'installment' && inst > 0 && (
        <div className="bg-emerald-50 rounded-xl p-3 text-sm text-emerald-800 leading-relaxed">
          ผ่อนเดือนละ <b>{fmtMoney(inst)} บาท</b> · ทั้งหมด <b>{numInstallments} งวด</b>
          {lastAmt > 0 && lastAmt !== inst && <> (งวดสุดท้าย {fmtMoney(lastAmt)} บาท)</>}
          <br />หักจนเงินต้นเหลือ 0 บาท
        </div>
      )}
      {p > 0 && type === 'amortized' && pay > 0 && amort && (
        amort.neverPayoff ? (
          <div className="bg-red-50 rounded-xl p-3 text-sm text-red-700 leading-relaxed">
            <AlertTriangle size={14} className="inline mr-1" />
            ยอดผ่อนน้อยเกินไป — ไม่พอจ่ายดอกเบี้ยเดือนแรก ({fmtMoney(p * rate / 100)} บาท) หนี้จะไม่มีวันหมด
            กรุณาเพิ่มยอดผ่อน
          </div>
        ) : (
          <div className="bg-emerald-50 rounded-xl p-3 text-sm text-emerald-800 leading-relaxed">
            ผ่อนเดือนละ <b>{fmtMoney(pay)} บาท</b> · ทั้งหมด <b>{amort.months.length} งวด</b><br />
            ผ่อนหมดเดือน <b>{amort.months.length ? ymLabel(amort.months[amort.months.length - 1]) : '-'}</b><br />
            ดอกเบี้ยรวมตลอดสัญญา <b>{fmtMoney(amort.totalInterest)} บาท</b>
          </div>
        )
      )}

      {err && <div className="text-red-600 text-sm">{err}</div>}
      <PrimaryBtn className="w-full py-3" onClick={() => {
        if (!p || p <= 0) { setErr('กรุณากรอกเงินต้น'); return; }
        if (type === 'installment' && inst <= 0) { setErr('กรุณากรอกยอดผ่อนต่อเดือน'); return; }
        if (type === 'amortized') {
          if (pay <= 0) { setErr('กรุณากรอกยอดผ่อนต่อเดือน'); return; }
          if (amort && amort.neverPayoff) { setErr('ยอดผ่อนน้อยกว่าดอกเบี้ย — กรุณาเพิ่มยอดผ่อน'); return; }
        }
        if (!startMonth) { setErr('กรุณาเลือกเดือนเริ่ม'); return; }
        const base = { type, principal: p, startMonth, note: note.trim() };
        if (type === 'interest') onSave({ ...base, rate, installment: 0, payment: 0 });
        else if (type === 'amortized') onSave({ ...base, rate, installment: 0, payment: pay });
        else onSave({ ...base, rate: 0, installment: inst, payment: 0 });
      }}>บันทึก</PrimaryBtn>
    </div>
  );
}

/* ---------------- ฟอร์มบันทึกการชำระ ---------------- */
function PaymentForm({ loan, month, onSave }) {
  const s = loanStats(loan, curYM());
  const row = s.rowOf[month] || null;
  const bill = round2(s.scheduleMap[month] != null ? s.scheduleMap[month] : s.monthly);
  const carryIn = row ? Math.max(0, row.carryIn) : 0;
  const required = row ? row.required : bill;        // ยอดที่ควรจ่าย (รวมยกมา)
  const alreadyPaid = row ? row.paid : 0;
  const bd = s.breakdownMap[month];
  // ตั้งต้น = ยอดที่ยังขาด (ถ้าจ่ายมาบางส่วนแล้ว) มิฉะนั้น = ยอดที่ควรจ่าย
  const suggested = round2(Math.max(0, required - alreadyPaid));
  const [amount, setAmount] = useState(String(suggested > 0 ? suggested : required));
  const todayISO = new Date().toISOString().slice(0, 10);
  const [date, setDate] = useState(todayISO);
  const billLabel = s.kind === 'interest' ? 'ดอกเบี้ยรอบนี้' : 'ค่างวดรอบนี้';
  const amt = Number(amount) || 0;
  // จำลองผลหลังบันทึก
  const afterShort = round2(required - alreadyPaid - amt);

  return (
    <div className="space-y-4">
      <div className="bg-stone-50 rounded-xl p-3 text-sm text-slate-600 leading-relaxed">
        รอบบิล <b className="text-slate-800">{ymLabelFull(month)}</b><br />
        {billLabel} <b className="text-emerald-700">{fmtMoney(bill)} บาท</b>
        {carryIn > 0.005 && (
          <><br /><span className="text-amber-600">+ ยอดค้างยกมา {fmtMoney(carryIn)} บาท</span>
            <br />รวมที่ควรจ่าย <b className="text-slate-800">{fmtMoney(required)} บาท</b></>
        )}
        {alreadyPaid > 0.005 && (
          <><br /><span className="text-xs text-slate-400">เดือนนี้รับชำระมาแล้ว {fmtMoney(alreadyPaid)} บาท — บันทึกนี้จะแทนที่ยอดเดิม</span></>
        )}
        {s.kind === 'amortized' && bd && (
          <><br /><span className="text-xs text-slate-400">
            แบ่งเป็นดอกเบี้ย {fmtMoney(bd.interest)} + เงินต้น {fmtMoney(bd.principalPart)}
          </span></>
        )}
        {s.kind === 'installment' && (
          <><br /><span className="text-xs text-slate-400">
            เงินต้นคงเหลือก่อนชำระ {fmtMoney(s.remaining)} บาท
          </span></>
        )}
      </div>
      <div>
        <label className={labelCls}>จำนวนเงินที่รับชำระจริง (บาท)</label>
        <input className={inputCls} value={amount} inputMode="numeric"
          onChange={(e) => setAmount(e.target.value.replace(/[^\d.]/g, ''))} />
        <div className="text-xs text-slate-400 mt-1">
          รับชำระเท่าไรก็บันทึกได้ — ถ้าจ่ายไม่ครบ ส่วนที่ขาดจะยกไปรวมกับรอบถัดไป
        </div>
      </div>
      {amt > 0 && (
        afterShort > 0.005 ? (
          <div className="bg-amber-50 rounded-xl p-3 text-sm text-amber-700">
            จ่ายไม่ครบ — จะเหลือยอดค้าง <b>{fmtMoney(afterShort)} บาท</b> ยกไปรอบถัดไป
          </div>
        ) : afterShort < -0.005 ? (
          <div className="bg-emerald-50 rounded-xl p-3 text-sm text-emerald-700">
            จ่ายเกิน <b>{fmtMoney(-afterShort)} บาท</b> — ส่วนเกินเป็นเครดิตหักรอบถัดไป
          </div>
        ) : (
          <div className="bg-emerald-50 rounded-xl p-3 text-sm text-emerald-700">
            จ่ายครบพอดี ✓
          </div>
        )
      )}
      <div>
        <label className={labelCls}>วันที่ชำระ</label>
        <input type="date" className={inputCls} value={date} onChange={(e) => setDate(e.target.value)} />
      </div>
      <PrimaryBtn className="w-full py-3" onClick={() => onSave({ amount: Number(amount) || 0, date })}>
        <CheckCircle2 size={18} /> ยืนยันการชำระ
      </PrimaryBtn>
    </div>
  );
}

/* ---------------- กล่องแชร์ไปไลน์ ---------------- */
function buildShareText(debtor) {
  const cur = curYM();
  const s = debtorStats(debtor, cur);
  const lines = [];
  lines.push('🧾 สรุปยอดเงินกู้');
  lines.push(`👤 ${debtor.name}`);
  lines.push(`📅 รอบเดือน ${ymLabelFull(cur)}`);
  lines.push('━━━━━━━━━━━━━━');
  s.loans.forEach(({ loan, s: ls }) => {
    if (!ls.thisMonthInBilling) return;
    const mark = ls.thisMonthSettled ? ' ✅'
      : ls.thisMonthHasPayment ? ' (จ่ายบางส่วน)' : '';
    if (ls.kind === 'installment') {
      lines.push(`▫️ เงินต้น ${fmtMoney(ls.principal)} บาท (ไม่มีดอกเบี้ย)`);
      lines.push(`   ค่างวดเดือนนี้ ${fmtMoney(ls.thisMonthBill)} บาท${mark}`);
      lines.push(`   เงินต้นคงเหลือ ${fmtMoney(ls.remaining)} บาท`);
    } else if (ls.kind === 'amortized') {
      lines.push(`▫️ เงินต้น ${fmtMoney(ls.principal)} บาท (ลดต้นลดดอก ${ls.rate}%)`);
      lines.push(`   ค่างวดเดือนนี้ ${fmtMoney(ls.thisMonthBill)} บาท${mark}`);
      lines.push(`   เงินต้นคงเหลือ ${fmtMoney(ls.remaining)} บาท`);
    } else {
      lines.push(`▫️ เงินต้น ${fmtMoney(ls.principal)} บาท`);
      lines.push(`   ดอกเบี้ย ${ls.rate}% = ${fmtMoney(ls.thisMonthBill)} บาท${mark}`);
    }
    if (ls.outstanding > 0.005) {
      lines.push(`   ⚠️ มียอดค้างยกมา ${fmtMoney(ls.outstanding)} บาท`);
    }
    if (ls.thisMonthHasPayment && !ls.thisMonthSettled) {
      lines.push(`   รับชำระแล้ว ${fmtMoney(ls.thisMonthPaidAmt)} บาท · ค้าง ${fmtMoney(ls.loanDueNow)} บาท`);
    }
  });
  lines.push('━━━━━━━━━━━━━━');
  lines.push(`💵 ยอดที่ต้องชำระเดือนนี้: ${fmtMoney(s.thisMonthDue)} บาท`);
  if (s.outstanding > 0) lines.push(`⚠️ ยอดค้างเดือนก่อน: ${fmtMoney(s.outstanding)} บาท`);
  lines.push(`💰 รวมต้องชำระทั้งสิ้น: ${fmtMoney(s.dueNow)} บาท`);
  lines.push('');
  lines.push(`📌 กำหนดชำระ: ${fmtThaiDate(nextNotifyDate())}`);
  return lines.join('\n');
}

function ShareModal({ debtor, onClose }) {
  const text = useMemo(() => buildShareText(debtor), [debtor]);
  const [copied, setCopied] = useState(false);

  const doCopy = async () => {
    try {
      await navigator.clipboard.writeText(text);
      setCopied(true);
    } catch (e) {
      const ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); setCopied(true); } catch (_) {}
      document.body.removeChild(ta);
    }
    setTimeout(() => setCopied(false), 2000);
  };
  const doShare = async () => {
    if (navigator.share) {
      try { await navigator.share({ text }); return; } catch (e) {}
    }
    try {
      window.open('https://line.me/R/share?text=' + encodeURIComponent(text), '_blank');
    } catch (e) { doCopy(); }
  };

  return (
    <Modal open={true} onClose={onClose} title="แชร์สรุปยอดผ่านไลน์">
      <pre className="bg-stone-50 border border-stone-200 rounded-xl p-3.5 text-sm text-slate-700 whitespace-pre-wrap font-sans leading-relaxed">{text}</pre>
      <div className="flex gap-2 mt-4">
        <PrimaryBtn className="flex-1 py-3 bg-emerald-700" onClick={doShare}>
          <Share2 size={17} /> ส่งทางไลน์
        </PrimaryBtn>
        <GhostBtn onClick={doCopy} className="flex-1 py-3">
          {copied ? <><CheckCircle2 size={16} className="text-emerald-600" /> คัดลอกแล้ว</> : <><Copy size={16} /> คัดลอกข้อความ</>}
        </GhostBtn>
      </div>
      <p className="text-xs text-slate-400 mt-3 text-center">
        บนมือถือจะเปิดเมนูแชร์ให้เลือกแอปไลน์ของแต่ละคนได้โดยตรง
      </p>
    </Modal>
  );
}

function SyncBadge() {
  const [status, setStatus] = useState(window._syncStatus || 'ok');
  useEffect(() => {
    const fn = (s) => setStatus(s);
    window._syncListeners.push(fn);
    return () => { window._syncListeners = window._syncListeners.filter((f) => f !== fn); };
  }, []);
  const map = {
    ok:      { color: 'bg-emerald-400', title: 'ซิงค์แล้ว' },
    syncing: { color: 'bg-amber-400 animate-pulse', title: 'กำลังซิงค์...' },
    offline: { color: 'bg-slate-400', title: 'ออฟไลน์ — ใช้ข้อมูลในเครื่อง' },
    error:   { color: 'bg-red-400', title: 'ซิงค์ไม่ได้ — ตรวจ Supabase' },
  };
  const { color, title } = map[status] || map.ok;
  return (
    <div title={title} className={`h-2.5 w-2.5 rounded-full ${color} shrink-0`} />
  );
}
